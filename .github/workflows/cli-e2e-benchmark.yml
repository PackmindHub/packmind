name: CLI E2E Benchmark

# Measures where the `cli-e2e-tests` suite spends its time, and what a candidate
# change actually buys, by running it under several environments and reporting
# them side by side in the job summary.
#
# The variant catalogue below is a 2×2: the stack shape (the whole compose stack
# reached through the frontend dev-server proxy, which is what CI does today,
# versus the API alone reached directly) crossed with the runner size and the
# worker count. Each cell isolates one axis; the fourth is the combination.
#
# Two ways to run it:
#   - `workflow_dispatch` from the default branch, to pick the variants;
#   - add the `cli-e2e-benchmark` label to a pull request, which runs the
#     catalogue against that branch. Re-add the label to re-run.
#
# Never on push: each variant starts its own full stack, so this is opt-in.

on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'Variants to run (see the catalogue in the plan job)'
        required: false
        default: 'baseline-8w6,baseline-8w6-cc,api-only-8w6,api-only-8w6-cc'
      node-version:
        description: 'Node version'
        required: false
        default: '24.18.0'
  pull_request:
    types: [labeled]

jobs:
  plan:
    # On a pull request, only the benchmark label starts this.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'cli-e2e-benchmark'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      names: ${{ steps.parse.outputs.names }}
    steps:
      - name: Build the variant matrix
        id: parse
        env:
          # Empty on a pull_request event, which has no inputs — the default in
          # the script then applies.
          REQUESTED: ${{ inputs.variants }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          // The catalogue. `workers: ''` means "leave Jest's default", which is
          // nproc - 1, so the 4-vCPU cells run the 3 workers CI uses today.
          const catalogue = {
            'baseline-4': { stack: 'baseline', runner: 'depot-ubuntu-24.04-4', workers: '' },
            'api-only-4': { stack: 'api-only', runner: 'depot-ubuntu-24.04-4', workers: '' },
            'baseline-8w6': { stack: 'baseline', runner: 'depot-ubuntu-24.04-8', workers: '6' },
            'api-only-8w6': { stack: 'api-only', runner: 'depot-ubuntu-24.04-8', workers: '6' },
            // The `-cc` arms are the same cell with one shared V8 compile cache
            // across the CLI spawns. Paired with the cell above they are an A/B
            // in a single run, on the same hardware — which is the only honest
            // way to size a 3-4s effect, since the run-to-run spread across
            // commits is wider than the effect itself.
            'baseline-8w6-cc': { stack: 'baseline', runner: 'depot-ubuntu-24.04-8', workers: '6', compileCache: true },
            'api-only-8w6-cc': { stack: 'api-only', runner: 'depot-ubuntu-24.04-8', workers: '6', compileCache: true },
            // Oversubscribed on purpose: the suite spends much of its time
            // waiting on a spawned CLI and on HTTP, so more workers than cores
            // may still pay. Where it stops paying is where the longest single
            // file becomes the floor.
            'api-only-8w12': { stack: 'api-only', runner: 'depot-ubuntu-24.04-8', workers: '12' },
            'api-only-16w12': { stack: 'api-only', runner: 'depot-ubuntu-24.04-16', workers: '12' },
            'api-only-16w24': { stack: 'api-only', runner: 'depot-ubuntu-24.04-16', workers: '24' },
          };

          const requested = (process.env.REQUESTED || '')
            .split(',')
            .map((name) => name.trim())
            .filter(Boolean);
          // The runner-size and stack-shape sweep is answered and written up in
          // apps/cli-e2e-tests/README.md, so the default is now the open
          // question: two A/B pairs for the compile cache, one per stack shape.
          const names = requested.length
            ? requested
            : ['baseline-8w6', 'baseline-8w6-cc', 'api-only-8w6', 'api-only-8w6-cc'];

          const unknown = names.filter((name) => !catalogue[name]);
          if (unknown.length) {
            console.error(`Unknown variant(s): ${unknown.join(', ')}`);
            console.error(`Known: ${Object.keys(catalogue).join(', ')}`);
            process.exit(1);
          }

          const matrix = names.map((name) => ({ name, ...catalogue[name] }));
          console.log(`matrix=${JSON.stringify(matrix)}`);
          console.log(`names=${names.join(',')}`);
          NODE
          echo "Planned: $(cat "$GITHUB_OUTPUT" | grep '^names=')"

  # Sizes the per-test fixture setup, and bcrypt's share of it, before anything
  # is changed. Deliberately separate from the `benchmark` job: it measures one
  # sequential setup against an idle API rather than the suite under load, which
  # is the number needed to judge whether making the bcrypt cost factor
  # configurable is worth touching production code for.
  #
  # No host `pnpm install`: both scripts use only Node built-ins. bcrypt is timed
  # inside the API container, where its native binding is actually built.
  setup-cost:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'cli-e2e-benchmark'
    runs-on: >-
      ${{ vars.ACTION_RUNNER_TAG_8_CORES || vars.ACTION_RUNNER_TAG ||
      'self-hosted' }}
    timeout-minutes: 25
    env:
      PACKMIND_INSTANCE_URL: http://localhost:3000
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.cli-e2e.yml
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ inputs.node-version || '24.18.0' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version || '24.18.0' }}

      - name: Cache pnpm supply-chain verification
        uses: actions/cache@v4
        with:
          path: ~/.cache/pnpm
          key: pnpm-verify-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Needed only by the `--full` measurement below, which spawns the real CLI
      # the way `runCli` does. The auth-only measurement uses Node built-ins.
      - name: Activate pnpm through corepack
        run: |
          corepack enable
          corepack prepare --activate

      - run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Generate tsconfig
        env:
          PACKMIND_EDITION: ${{ vars.PACKMIND_EDITION }}
        run: node scripts/select-tsconfig.mjs

      - run: ./node_modules/.bin/nx run packmind-cli:build

      - name: Install dist CLI runtime dependencies
        run: sh scripts/install-dist-cli-deps.sh

      - name: Fix CLI artifacts permissions
        run: |
          chmod +x dist/apps/cli/main.cjs || true
          chmod -R +r dist/apps/cli/

      - name: Start the API alone
        env:
          PACKMIND_EDITION: ${{ vars.PACKMIND_EDITION }}
          COMPOSE_PROJECT_NAME: cli-e2e-cost-${{ github.run_number }}
          CI: 'true'
        run: |
          set -eu
          # shellcheck disable=SC2086 # COMPOSE_FILES is a deliberate word list
          APP_WEB_URL="${PACKMIND_INSTANCE_URL}" docker compose ${COMPOSE_FILES} \
            up -d --wait --wait-timeout 420 backend

      - name: Wait for the API to answer
        run: |
          timeout 120 bash -c \
            "until curl -f ${PACKMIND_INSTANCE_URL}/api/v0/healthcheck > /dev/null 2>&1; do sleep 2; done"

      - name: Measure one fixture setup
        run: |
          node scripts/measure-cli-e2e-setup-cost.mjs --iterations 30 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The same sequence plus what install.spec.ts's beforeEach adds — the git
      # repo, the package, and one real `install` run. That file sets the
      # suite's floor and its `it` bodies are pure assertions, so this is the
      # whole per-test cost of the file that decides the wall clock. 62 is its
      # test count.
      - name: Measure one whole install.spec test
        run: |
          node scripts/measure-cli-e2e-setup-cost.mjs --full \
            --iterations 15 --tests 62 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Measure bcrypt inside the API container
        env:
          COMPOSE_PROJECT_NAME: cli-e2e-cost-${{ github.run_number }}
        run: |
          set -eu
          # shellcheck disable=SC2086
          docker compose ${COMPOSE_FILES} exec -T backend \
            node scripts/measure-bcrypt-cost.mjs --rounds 4,6,8,10 --samples 5 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        env:
          COMPOSE_PROJECT_NAME: cli-e2e-cost-${{ github.run_number }}
        run: |
          # shellcheck disable=SC2086
          docker compose ${COMPOSE_FILES} down -v --remove-orphans

  benchmark:
    needs: plan
    runs-on: ${{ matrix.variant.runner }}
    timeout-minutes: 30
    strategy:
      # One variant failing still leaves the others worth comparing.
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ inputs.node-version || '24.18.0' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version || '24.18.0' }}

      # pnpm comes from corepack rather than from a third-party setup action.
      # This file is entirely new code, so SonarCloud's supply-chain rule
      # requires every non-first-party action in it to be pinned to a full
      # commit SHA — and corepack reads the version straight from
      # `packageManager` in package.json, which is one dependency fewer and one
      # pin fewer to keep current. The other workflows keep the action; their
      # lines predate the rule, and changing them is a repo-wide decision rather
      # than this PR's.
      #
      # Order matters: corepack writes its shims for whichever Node is on PATH,
      # so this has to follow setup-node. That costs setup-node's
      # `cache: 'pnpm'`, which needs pnpm to exist before it runs, so the store
      # is cached explicitly below instead.
      - name: Activate pnpm through corepack
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache pnpm supply-chain verification
        uses: actions/cache@v4
        with:
          path: ~/.cache/pnpm
          key: pnpm-verify-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # `--ignore-scripts` here, unlike in build.yml: this host install only has
      # to produce `nx`, the CLI bundle and Jest. The project's own `prepare`
      # already exits immediately under CI, and the dependencies with build
      # scripts — bcrypt above all — belong to the API, which runs in the
      # compose stack with its own install rather than on this host.
      - run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Generate tsconfig
        env:
          PACKMIND_EDITION: ${{ vars.PACKMIND_EDITION }}
        run: node scripts/select-tsconfig.mjs

      - run: ./node_modules/.bin/nx run packmind-cli:build

      - name: Install dist CLI runtime dependencies
        run: sh scripts/install-dist-cli-deps.sh

      - name: Fix CLI artifacts permissions
        run: |
          chmod +x dist/apps/cli/main.cjs || true
          chmod -R +r dist/apps/cli/

      # Every expression below reaches the shell through `env:` rather than
      # being spliced into the script text. These particular values come from
      # the catalogue above, but keeping the boundary makes the scripts safe by
      # construction rather than by inspection.
      - name: Resolve variant
        env:
          VARIANT_STACK: ${{ matrix.variant.stack }}
          VARIANT_WORKERS: ${{ matrix.variant.workers }}
        run: |
          set -eu
          case "${VARIANT_STACK}" in
            baseline)
              # What CI runs today: the whole stack, and the API reached through
              # the frontend dev server's /api proxy on port 4200.
              compose_files='-f docker-compose.yml'
              services=''
              instance_url='http://localhost:4200'
              ;;
            api-only)
              # `backend` alone (Compose still pulls in install-dependencies,
              # run-migrations, postgres and redis), reached directly.
              compose_files='-f docker-compose.yml -f docker-compose.cli-e2e.yml'
              services='backend'
              instance_url='http://localhost:3000'
              ;;
            *)
              echo "Unknown stack '${VARIANT_STACK}'" >&2
              exit 1
              ;;
          esac
          {
            echo "COMPOSE_FILES=${compose_files}"
            echo "COMPOSE_SERVICES=${services}"
            echo "PACKMIND_INSTANCE_URL=${instance_url}"
            echo "JEST_WORKERS=${VARIANT_WORKERS}"
          } >> "$GITHUB_ENV"
          echo "nproc: $(nproc)"

      - name: Start the stack
        id: stack
        env:
          PACKMIND_EDITION: ${{ vars.PACKMIND_EDITION }}
          COMPOSE_PROJECT_NAME: cli-e2e-bench-${{ github.run_number }}-${{ matrix.variant.name }}
          CI: 'true'
        run: |
          set -eu
          started=$(date +%s)
          # shellcheck disable=SC2086 # COMPOSE_FILES/SERVICES are deliberate word lists
          APP_WEB_URL="${PACKMIND_INSTANCE_URL}" docker compose ${COMPOSE_FILES} \
            up -d --wait --wait-timeout 420 ${COMPOSE_SERVICES}
          echo "startup_seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2086
          docker compose ${COMPOSE_FILES} ps -a

      - name: Wait for the API to answer
        run: |
          timeout 120 bash -c \
            "until curl -f ${PACKMIND_INSTANCE_URL}/api/v0/healthcheck > /dev/null 2>&1; do sleep 2; done"

      # `NODE_COMPILE_CACHE` is set only on the `-cc` arms. An empty value is
      # the same as unset to Node, so the non-cc arms are genuinely uncached.
      # `runCli` copies the whole `process.env` into the CLI it spawns, so
      # setting it here reaches every spawn without a test-helper change.
      - name: Run the suite
        id: run
        env:
          PACKMIND_EDITION: ${{ vars.PACKMIND_EDITION }}
          NODE_OPTIONS: '--max-old-space-size=16384 --no-experimental-strip-types'
          VARIANT_NAME: ${{ matrix.variant.name }}
          NODE_COMPILE_CACHE: >-
            ${{ matrix.variant.compileCache && format('{0}/node-compile-cache',
            runner.temp) || '' }}
        run: |
          set -eu
          mkdir -p benchmark-results
          echo "NODE_COMPILE_CACHE=${NODE_COMPILE_CACHE:-<unset>}"
          # The report script reads the label and the worker count back out of
          # the file name, since Jest's JSON records neither.
          workers="${JEST_WORKERS:-}"
          if [ -z "${workers}" ]; then
            workers=$(( $(nproc) - 1 ))
            args=''
          else
            args="--maxWorkers=${workers}"
          fi
          report="benchmark-results/${VARIANT_NAME}.workers-${workers}.json"
          started=$(date +%s)
          # shellcheck disable=SC2086 # args is a deliberate word list
          ./node_modules/.bin/nx test cli-e2e-tests --skip-nx-cache \
            --json --outputFile="${report}" ${args}
          echo "suite_seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"
          if [ ! -f "${report}" ]; then
            echo "Jest wrote no JSON report to ${report}" >&2
            exit 1
          fi
          echo "report=${report}" >> "$GITHUB_OUTPUT"

      # Tee rather than redirect: the job summary is the readable form, but it is
      # not exposed by the REST API, so the step log is the only copy anything
      # outside a browser can get at.
      - name: Summarize
        if: always() && steps.run.outputs.report != ''
        env:
          VARIANT_NAME: ${{ matrix.variant.name }}
          VARIANT_STACK: ${{ matrix.variant.stack }}
          VARIANT_RUNNER: ${{ matrix.variant.runner }}
          STARTUP_SECONDS: ${{ steps.stack.outputs.startup_seconds }}
          SUITE_SECONDS: ${{ steps.run.outputs.suite_seconds }}
          REPORT: ${{ steps.run.outputs.report }}
        run: |
          {
            echo "### \`${VARIANT_NAME}\` — ${VARIANT_STACK} on ${VARIANT_RUNNER}"
            echo
            echo "- Stack startup: **${STARTUP_SECONDS}s**"
            echo "- Suite step (Nx included): **${SUITE_SECONDS}s**"
            echo
            node scripts/cli-e2e-benchmark-report.mjs report "${REPORT}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record the step timings
        if: always() && steps.run.outputs.report != ''
        env:
          VARIANT_NAME: ${{ matrix.variant.name }}
          VARIANT_STACK: ${{ matrix.variant.stack }}
          VARIANT_RUNNER: ${{ matrix.variant.runner }}
          STARTUP_SECONDS: ${{ steps.stack.outputs.startup_seconds }}
          SUITE_SECONDS: ${{ steps.run.outputs.suite_seconds }}
        run: |
          # Kept next to the Jest report so the compare job can show the stack
          # startup, which the Jest JSON knows nothing about. Built with jq so
          # the values are encoded as JSON rather than pasted into a template.
          jq -n \
            --arg name "${VARIANT_NAME}" \
            --arg stack "${VARIANT_STACK}" \
            --arg runner "${VARIANT_RUNNER}" \
            --argjson startupSeconds "${STARTUP_SECONDS}" \
            --argjson suiteStepSeconds "${SUITE_SECONDS}" \
            '{name: $name, stack: $stack, runner: $runner, startupSeconds: $startupSeconds, suiteStepSeconds: $suiteStepSeconds}' \
            > "benchmark-results/${VARIANT_NAME}.env.json"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-e2e-benchmark-${{ github.run_number }}-${{ matrix.variant.name }}
          path: benchmark-results/
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        env:
          COMPOSE_PROJECT_NAME: cli-e2e-bench-${{ github.run_number }}-${{ matrix.variant.name }}
        run: |
          # shellcheck disable=SC2086
          docker compose ${COMPOSE_FILES:--f docker-compose.yml} down -v --remove-orphans

  compare:
    needs: [plan, benchmark]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download every variant report
        uses: actions/download-artifact@v4
        with:
          pattern: cli-e2e-benchmark-${{ github.run_number }}-*
          path: benchmark-results
          merge-multiple: true

      - name: Compare the variants
        env:
          VARIANT_NAMES: ${{ needs.plan.outputs.names }}
        run: |
          set -eu
          # Planned order, so the first variant is the comparison baseline.
          ordered=''
          for variant in $(printf '%s' "${VARIANT_NAMES}" | tr ',' ' '); do
            match=$(find benchmark-results -name "${variant}.workers-*.json" | head -n 1)
            if [ -n "${match}" ]; then
              ordered="${ordered} ${match}"
            else
              echo "No report for variant '${variant}' — it failed or never started." >&2
            fi
          done
          if [ -z "${ordered}" ]; then
            echo "No report to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            # shellcheck disable=SC2086 # ordered is a deliberate word list
            node scripts/cli-e2e-benchmark-report.mjs compare ${ordered}
            echo
            echo '### Stack startup and total suite step'
            echo
            echo '| Variant | Stack | Runner | Startup | Suite step |'
            echo '| --- | --- | --- | --: | --: |'
            for env_file in benchmark-results/*.env.json; do
              [ -f "${env_file}" ] || continue
              node -e '
                const e = require("fs").readFileSync(process.argv[1], "utf-8");
                const v = JSON.parse(e);
                console.log(`| \`${v.name}\` | ${v.stack} | \`${v.runner}\` | ${v.startupSeconds}s | ${v.suiteStepSeconds}s |`);
              ' "${env_file}"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
