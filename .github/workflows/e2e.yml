name: End-to-End Tests

# Both suites in here build everything they need from source, inside their own
# containers — neither consumes a build artifact. That duplicated work is the
# price of the property that matters: they can start at T=0, in parallel with
# `build`, instead of adding their whole duration to the front of every
# downstream stage. Do not "optimise" them into consuming `build`'s artifacts;
# that would put them back on the critical path they were moved off.
#
# HUSKY is needed here for the same reason build.yml sets it: `cli-e2e-tests`
# runs `pnpm install`, which triggers husky's `prepare` script.
env:
  HUSKY: '0'

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
        description: 'Node.js version to use'

# No `secrets:` block on purpose: neither job below references one. Passing a
# secret the called workflow has not declared fails the run.

# Be careful with `if:` in here. Every job below is unconditional, and that is
# what makes this workflow's caller job non-skippable. If all jobs in a called
# workflow skip, the caller job is reported `skipped`, and `docker` /
# `deploy-staging-and-release` / `publish-cli-release` — which need it — skip
# silently, with no failure anywhere. A docs-only fast path has to be built by
# making these jobs pass quickly, not by skipping them.
jobs:
  cli-e2e-tests:
    # Two legs, in parallel: the CLI this commit builds, and the CLI already
    # published on the registry. The published-CLI leg guards the API against
    # breaking the versions users are running; it validates nothing about this
    # commit's own CLI, so it has no reason to wait for the other leg. Run in
    # sequence in a single job, it added its whole duration to the critical path
    # of this workflow, which every deployment gate waits for.
    name: cli-e2e-tests (${{ matrix.cli-source }})
    # An 8-core runner rather than the pipeline's default 4. Measured: the suite
    # is bound by waiting on a spawned CLI and on HTTP, not by CPU, so doubling
    # the cores nearly halves it — 105s to 55s — while the total work barely
    # changes. Jest's own default worker count is `nproc - 1`, so it follows the
    # runner without a flag here.
    #
    # A bigger runner buys nothing beyond this: at 8 cores the longest single
    # file (`install.spec.ts`) already accounts for the whole run, so the
    # workers idle on it. Splitting that file is the prerequisite for more
    # capacity paying off, and is capped at `serial / workers` ~= 44s.
    #
    # The fallback chain keeps a checkout without the new variable working: the
    # 8-core tag, then the pipeline's usual tag, then self-hosted.
    runs-on: >-
      ${{ vars.ACTION_RUNNER_TAG_8_CORES || vars.ACTION_RUNNER_TAG ||
      'self-hosted' }}
    timeout-minutes: 20
    env:
      PACKMIND_INSTANCE_URL: http://localhost:4200
    strategy:
      # A failure on one CLI is a distinct piece of information from a failure
      # on the other; cancelling the sibling would hide half of it.
      fail-fast: false
      matrix:
        node-version: ['${{ inputs.node-version }}']
        cli-source: [workspace, registry]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Cache pnpm supply-chain verification
        uses: actions/cache@v4
        with:
          path: ~/.cache/pnpm
          key: pnpm-verify-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate tsconfig
        env:
          PACKMIND_EDITION: ${{ vars.PACKMIND_EDITION }}
        run: node scripts/select-tsconfig.mjs

      # Cheap, and it is the only way to tell from a log whether the job landed
      # on the 8-core runner and how many workers Jest will therefore use.
      - name: Report the runner size
        run: |
          echo "cores: $(nproc) - Jest defaults to $(( $(nproc) - 1 )) workers"

      # Nx keeps two scratch directories inside the repo, and the compose
      # services run Nx as ROOT over the `.:/packmind` bind mount, so they share
      # both. Root writing into a runner-owned file is fine; the reverse is not,
      # so whichever side gets there first decides whether the later `nx test`
      # survives. Both must therefore be claimed as the runner user BEFORE
      # `docker compose up`:
      #
      #   .nx/cache/terminalOutputs  Nx writes a task's captured output here
      #                              even under `--skip-nx-cache`. Creating the
      #                              directory is enough: owning it lets the
      #                              runner add files, whatever root also puts
      #                              inside.
      #   .nx/workspace-data         a SQLite DB (see the NX_INVOCATION_ROOT_PID
      #                              comment in docker-compose.yml). The runner
      #                              has to CREATE the DB, not just the
      #                              directory, so an actual Nx command is
      #                              required — `nx show projects` is the
      #                              cheapest one that does it.
      #
      # Getting this wrong is not obvious from the failure: the run reports
      # `17 passed, 287 total` and then dies in Nx's own output writer with
      # `EACCES ... .nx/cache/terminalOutputs/<id>`. That is what happened when
      # this leg's `nx show projects` claimed only the second directory.
      - name: Claim Nx's scratch directories as the runner user
        run: |
          mkdir -p .nx/cache/terminalOutputs .nx/workspace-data
          ./node_modules/.bin/nx show projects > /dev/null

      # Workspace leg only: this is the CLI under test there. The registry leg
      # runs the binary at `CLI_BINARY_PATH` and needs no `dist/apps/cli` — the
      # full suite passes without it, which the failure above confirmed. Keeping
      # the build off that leg also decouples the signals: a broken CLI build no
      # longer reddens "does the published CLI still work against this API", a
      # question `build-cli` already answers in its own job.
      - name: Build the workspace CLI
        if: matrix.cli-source == 'workspace'
        run: ./node_modules/.bin/nx run packmind-cli:build

      - name: Install dist CLI runtime dependencies
        if: matrix.cli-source == 'workspace'
        run: sh scripts/install-dist-cli-deps.sh

      - name: Fix CLI artifacts permissions
        if: matrix.cli-source == 'workspace'
        run: |
          chmod +x dist/apps/cli/main.cjs || true
          chmod -R +r dist/apps/cli/
          ls -la dist/apps/cli/

      - name: Install latest production CLI from registry
        if: matrix.cli-source == 'registry'
        run: |
          PROD_CLI_DIR="$(mktemp -d)"
          cd "${PROD_CLI_DIR}"
          pnpm init
          # Throwaway install: only need the CLI binary resolvable to run --version.
          # bcrypt/msgpackr-extract ship prebuilt binaries, so their build scripts
          # are not required. Disable strictDepBuilds (default true in pnpm 11) to
          # avoid ERR_PNPM_IGNORED_BUILDS here where there is no allowBuilds config.
          pnpm add @packmind/cli --config.strictDepBuilds=false
          CLI_BINARY_PATH="$(node -e "console.log(require.resolve('@packmind/cli'))")"
          cd -
          echo "Installed CLI version: $(node "${CLI_BINARY_PATH}" --version)"
          # Only ever set on this leg: the test helpers fall back to the built
          # CLI when it is absent, but an empty value would be taken as a path.
          echo "CLI_BINARY_PATH=${CLI_BINARY_PATH}" >> $GITHUB_ENV

      - name: Start docker compose for CLI E2E tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            echo "Starting docker compose with COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}"
            echo "Docker version:"
            docker --version
            docker compose version
            echo "Starting containers..."
            docker compose up -d --wait --wait-timeout 300
            echo "Docker compose up completed. Container status:"
            docker compose ps -a
            docker ps -a --format 'table {{.Names}}\t{{.Status}}'
        env:
          PACKMIND_EDITION: ${{ vars.PACKMIND_EDITION }}
          COMPOSE_PROJECT_NAME: cli-e2e-${{ github.run_number }}-${{ matrix.cli-source }}
          CI: 'true'
          APP_WEB_URL: ${{ env.PACKMIND_INSTANCE_URL }}

      - name: Wait for services to be ready
        env:
          COMPOSE_PROJECT_NAME: cli-e2e-${{ github.run_number }}-${{ matrix.cli-source }}
          PACKMIND_INSTANCE_URL: ${{ env.PACKMIND_INSTANCE_URL }}
        run: |
          echo "Waiting for API to be ready..."
          timeout 60 bash -c "until curl -f ${PACKMIND_INSTANCE_URL}/api/v0/healthcheck > /dev/null 2>&1; do sleep 2; done"

      # `--skip-nx-cache` on both legs: the cache key covers the workspace
      # sources, not `CLI_BINARY_PATH`, so the two legs would otherwise be
      # indistinguishable to Nx.
      #
      # Deliberately NOT setting `NODE_COMPILE_CACHE` here. Measured in
      # isolation it looks like the cheapest win available: one shared V8
      # bytecode cache takes a CLI spawn from 413ms to 354ms, -14%, twice
      # reproduced on this runner. Under the real suite it does not survive: run
      # as A/B arms in one benchmark run, the two stack shapes disagreed in sign
      # (-2.3s and +5.7s) and both cached arms did MORE total work than their
      # controls — six workers contending over one cache directory is the likely
      # reason, which a sequential probe cannot see. Do not re-derive the -14%
      # and ship it. A per-worker cache dir (keyed on JEST_WORKER_ID) is the
      # untried variant, and needs a `runCli` change plus a fresh A/B.
      - name: Run CLI E2E tests
        env:
          PACKMIND_EDITION: ${{ vars.PACKMIND_EDITION }}
          NODE_OPTIONS: '--max-old-space-size=16384 --no-experimental-strip-types'
        run: ./node_modules/.bin/nx test cli-e2e-tests --skip-nx-cache

      - name: Collect Docker container logs
        if: always()
        env:
          COMPOSE_PROJECT_NAME: cli-e2e-${{ github.run_number }}-${{ matrix.cli-source }}
        run: |
          mkdir -p docker-logs-cli-e2e
          echo "Looking for containers with prefix: ${COMPOSE_PROJECT_NAME}"
          docker ps -a --format '{{.Names}}' | grep "^${COMPOSE_PROJECT_NAME}" || echo "No containers found"
          for container in $(docker ps -a --format '{{.Names}}' | grep "^${COMPOSE_PROJECT_NAME}" || true); do
            echo "Collecting logs for $container..."
            docker logs "$container" > "docker-logs-cli-e2e/${container}.log" 2>&1 || true
          done
          echo "Collected logs:"
          ls -la docker-logs-cli-e2e/ || echo "No logs collected"

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs-cli-e2e-${{ github.run_number }}-${{ matrix.cli-source }}-${{ github.sha }}
          path: docker-logs-cli-e2e/
          if-no-files-found: ignore

      - name: Cleanup Docker containers
        if: always()
        env:
          COMPOSE_PROJECT_NAME: cli-e2e-${{ github.run_number }}-${{ matrix.cli-source }}
        run: docker compose down -v --remove-orphans

  # Everything this job needs runs inside the compose stack, so it has no
  # `setup-node` and no use for `inputs.node-version` — the node version is
  # pinned by the compose file's images.
  e2e-tests:
    runs-on: ${{ vars.ACTION_RUNNER_TAG || 'self-hosted' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Start E2E test environment
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            echo "Starting docker compose with COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}"
            echo "Docker version:"
            docker --version
            docker compose version
            echo "Starting containers..."
            docker compose --profile=e2e up -d --wait-timeout 300
            echo "Docker compose up completed. Container status:"
            docker compose --profile=e2e ps -a
            docker ps -a --format 'table {{.Names}}\t{{.Status}}'
        env:
          PACKMIND_EDITION: ${{ vars.PACKMIND_EDITION }}
          COMPOSE_PROJECT_NAME: ci-${{ github.run_number }}
          CI: 'true'
          APP_WEB_URL: http://frontend:4200

      - name: Wait for E2E tests to complete
        env:
          PACKMIND_EDITION: ${{ vars.PACKMIND_EDITION }}
          COMPOSE_PROJECT_NAME: ci-${{ github.run_number }}
        run: ./scripts/wait-for-e2e-tests.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}-${{ github.sha }}
          path: apps/e2e-tests/playwright-report/
          if-no-files-found: ignore

      - name: Collect Docker container logs
        if: always()
        env:
          COMPOSE_PROJECT_NAME: ci-${{ github.run_number }}
        run: |
          mkdir -p docker-logs
          echo "Looking for containers with prefix: ${COMPOSE_PROJECT_NAME}"
          docker ps -a --format '{{.Names}}' | grep "^${COMPOSE_PROJECT_NAME}" || echo "No containers found"
          for container in $(docker ps -a --format '{{.Names}}' | grep "^${COMPOSE_PROJECT_NAME}" || true); do
            echo "Collecting logs for $container..."
            docker logs "$container" > "docker-logs/${container}.log" 2>&1 || true
          done
          echo "Collected logs:"
          ls -la docker-logs/ || echo "No logs collected"

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs-${{ github.run_number }}-${{ github.sha }}
          path: docker-logs/
          if-no-files-found: ignore

      - name: Cleanup Docker containers
        if: always()
        env:
          COMPOSE_PROJECT_NAME: ci-${{ github.run_number }}
        run: docker compose --profile=e2e down -v --remove-orphans
