name: Quality and Security Checks

env:
  ENTERPRISE_EDITION: proprietary
  OSS_EDITION: oss
  HUSKY: '0'

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
        description: 'Node.js version to use'
    secrets:
      GITGUARDIAN_API_KEY:
        required: true
        description: 'API key for GitGuardian security scanning'
      SONAR_TOKEN:
        required: true
        description: 'Token for SonarCloud code quality analysis'

jobs:
  gitguardian-scan:
    runs-on: ${{ vars.ACTION_RUNNER_TAG || 'self-hosted' }}
    timeout-minutes: ${{ github.actor == 'dependabot[bot]' && 15 || 30 }}
    name: GitGuardian scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitGuardian scan
        uses: GitGuardian/ggshield/actions/secret@v1.41.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  lint-and-format:
    runs-on: ${{ vars.ACTION_RUNNER_TAG || 'self-hosted' }}
    timeout-minutes: ${{ github.actor == 'dependabot[bot]' && 15 || 30 }}
    strategy:
      matrix:
        node-version: ["${{ inputs.node-version }}"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Cache pnpm supply-chain verification
        uses: actions/cache@v4
        with:
          path: ~/.cache/pnpm
          key: pnpm-verify-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-verify-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Generate Proprietary tsconfig
        env:
          PACKMIND_EDITION: ${{ env.ENTERPRISE_EDITION }}
        run: node scripts/select-tsconfig.mjs
      - name: Lint code (Proprietary)
        env:
          PACKMIND_EDITION: ${{ env.ENTERPRISE_EDITION }}
        run: ./node_modules/.bin/nx run-many -t lint --tuiAutoExit
      - name: Check code formatting
        run: pnpm prettier:check

  sonarqube:
    if: vars.PACKMIND_EDITION != 'proprietary'
    runs-on: ${{ vars.ACTION_RUNNER_TAG || 'self-hosted' }}
    timeout-minutes: ${{ github.actor == 'dependabot[bot]' && 15 || 30 }}
    strategy:
      matrix:
        node-version: ["${{ inputs.node-version }}"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Cache pnpm supply-chain verification
        uses: actions/cache@v4
        with:
          path: ~/.cache/pnpm
          key: pnpm-verify-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-verify-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Generate Proprietary tsconfig
        env:
          PACKMIND_EDITION: ${{ env.ENTERPRISE_EDITION }}
        run: node scripts/select-tsconfig.mjs
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  check-oss-sync:
    if: vars.PACKMIND_EDITION == 'proprietary'
    runs-on: ${{ vars.ACTION_RUNNER_TAG || 'self-hosted' }}
    timeout-minutes: ${{ github.actor == 'dependabot[bot]' && 15 || 30 }}
    name: Check source parity with OSS

    steps:
      - name: Checkout proprietary repo
        uses: actions/checkout@v4

      - name: Clone OSS repo (shallow)
        run: git clone --depth 1 --branch main https://github.com/PackmindHub/Packmind.git /tmp/packmind-oss

      - name: Compare apps/cli/src directories
        run: |
          PROPRIETARY_COUNT=$(find apps/cli/src -type f | wc -l | tr -d ' ')
          OSS_COUNT=$(find /tmp/packmind-oss/apps/cli/src -type f | wc -l | tr -d ' ')
          echo "Proprietary: ${PROPRIETARY_COUNT} files | OSS: ${OSS_COUNT} files"

          if [ "$PROPRIETARY_COUNT" -eq 0 ] || [ "$OSS_COUNT" -eq 0 ]; then
            echo "::error::One of the directories is empty or missing. Aborting comparison."
            exit 1
          fi

          echo ""
          echo "=== File presence differences ==="
          diff -rq apps/cli/src /tmp/packmind-oss/apps/cli/src || FILE_DIFF=1

          echo ""
          echo "=== Content differences ==="
          diff -r apps/cli/src /tmp/packmind-oss/apps/cli/src || CONTENT_DIFF=1

          if [ "${FILE_DIFF:-0}" = "1" ] || [ "${CONTENT_DIFF:-0}" = "1" ]; then
            echo ""
            echo "::error::CLI source code (apps/cli/src) has diverged from the OSS repo (PackmindHub/Packmind). Please sync the changes."
            exit 1
          fi

          echo "CLI source code is in sync with OSS."

      - name: Compare shared packages
        run: |
          # Packages allowed to diverge. Everything else in packages/ that exists in
          # both repos must stay byte-identical - proprietary-only code belongs in a
          # proprietary-only package, not in a fork of a shared one.
          SKIP_PACKAGES=(integration-tests)

          # Build output, plus every artefact Packmind deploys for AI coding agents.
          # Each repo runs its own deployment, so those are regenerated independently
          # and drift on their own schedule - comparing them is pure noise.
          EXCLUDES=(
            -x node_modules -x dist -x coverage -x '*.tsbuildinfo'
            -x .packmind -x .claude -x .claude-plugin -x .cursor -x .github
            -x .continue -x .gitlab -x .opencode -x .agents -x .junie
            -x AGENTS.md -x CLAUDE.md -x .packmind.md
            -x packmind.json -x packmind-lock.json
          )

          if [ ! -d /tmp/packmind-oss/packages ]; then
            echo "::error::OSS checkout has no packages/ directory. Aborting comparison."
            exit 1
          fi

          CHECKED=0
          DIVERGED=()
          MISSING=()

          for DIR in packages/*/; do
            PKG=$(basename "$DIR")

            for SKIP in "${SKIP_PACKAGES[@]}"; do
              if [ "$PKG" = "$SKIP" ]; then
                echo "skipped     ${PKG} (deny-list)"
                continue 2
              fi
            done

            # Proprietary-only package - nothing on the OSS side to compare against.
            if [ ! -d "/tmp/packmind-oss/packages/${PKG}" ]; then
              echo "not in OSS  ${PKG}"
              continue
            fi

            CHECKED=$((CHECKED + 1))
            if diff -r "${EXCLUDES[@]}" "packages/${PKG}" "/tmp/packmind-oss/packages/${PKG}" > "/tmp/parity-${PKG}.diff" 2>&1; then
              echo "in sync     ${PKG}"
            else
              echo "DIVERGED    ${PKG}"
              DIVERGED+=("${PKG}")
            fi
          done

          # A package that exists in OSS must exist here too - the fork is a superset.
          for DIR in /tmp/packmind-oss/packages/*/; do
            PKG=$(basename "$DIR")
            if [ ! -d "packages/${PKG}" ]; then
              MISSING+=("${PKG}")
            fi
          done

          echo ""
          echo "Compared ${CHECKED} shared packages."

          if [ "$CHECKED" -eq 0 ]; then
            echo "::error::No shared packages were compared - the comparison is not doing anything. Aborting."
            exit 1
          fi

          for PKG in "${DIVERGED[@]}"; do
            echo ""
            echo "=== packages/${PKG} ==="
            head -n 200 "/tmp/parity-${PKG}.diff"
            TOTAL=$(wc -l < "/tmp/parity-${PKG}.diff" | tr -d ' ')
            if [ "$TOTAL" -gt 200 ]; then
              echo "... (${TOTAL} lines total, output truncated)"
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo ""
            echo "::error::Present in OSS but missing from this repo: ${MISSING[*]}. Run the sync-from-oss-repository workflow to pull them in."
          fi

          if [ ${#DIVERGED[@]} -gt 0 ]; then
            echo ""
            echo "::error::These packages have diverged from the OSS repo (PackmindHub/Packmind): ${DIVERGED[*]}. Backport the change to OSS main first, then re-run - shared packages must stay identical across editions. If a package is genuinely meant to diverge, add it to SKIP_PACKAGES in this step."
          fi

          if [ ${#DIVERGED[@]} -gt 0 ] || [ ${#MISSING[@]} -gt 0 ]; then
            exit 1
          fi

          echo "All shared packages are in sync with OSS."
