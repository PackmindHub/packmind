name: Weekly CLAUDE.md Improvement

on:
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  improve-claude-md:
    # This workflow file is synced between PackmindHub/packmind and our proprietary fork,
    # and runs in both. What differs is the *scope* of the run, not whether it runs: the
    # "Resolve CLAUDE.md worklist" step below decides which files each repository owns, so
    # the two runs never touch the same file. Anywhere else the job is skipped, making the
    # schedule and workflow_dispatch triggers no-ops.
    if: >-
      github.repository == 'PackmindHub/packmind' ||
      github.repository == 'PackmindHub/packmind-proprietary'
    runs-on: ${{ vars.ACTION_RUNNER_TAG || 'self-hosted' }}
    # 60 rather than 45: the proprietary run authors missing CLAUDE.md files from scratch,
    # which is heavier than auditing existing ones.
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # PAT so the pull request opened below triggers CI (a PR opened with the
          # default GITHUB_TOKEN would not).
          token: ${{ secrets.PACKMIND_BOT_PAT }}
          clean: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        # Only the "Dump the Nx target inventory" step below needs node_modules: it runs the
        # local nx to read the project graph. `prepare` no-ops under CI (scripts/prepare.mjs
        # exits early when $CI is set), so this installs and nothing else.
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Install claude-md-management plugin
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Refresh the official marketplace first: the CLI ships an auto-registered
          # but stale snapshot that can predate this plugin. `add` fetches the latest
          # manifest; if it's already registered, fall back to `update`.
          claude plugin marketplace add anthropics/claude-plugins-official \
            || claude plugin marketplace update claude-plugins-official
          claude plugin install claude-md-management@claude-plugins-official

      - name: Resolve CLAUDE.md worklist
        run: |
          set -euo pipefail
          mkdir -p tmp

          if [ "${{ github.repository }}" = 'PackmindHub/packmind-proprietary' ]; then
            # Proprietary run: only projects that do NOT exist in OSS. Every shared
            # CLAUDE.md is owned by the OSS repository's run of this same workflow -
            # auditing it in both repositories would diverge the files and conflict on the
            # next sync-from-oss-repository merge.
            git clone --depth 1 --branch main \
              https://github.com/PackmindHub/Packmind.git /tmp/packmind-oss

            if [ ! -d /tmp/packmind-oss/packages ]; then
              echo "::error::OSS checkout has no packages/ directory. Aborting."
              exit 1
            fi

            : > tmp/claude-md-worklist.txt
            for DIR in apps/*/ packages/*/; do
              PROJ="${DIR%/}"
              [ -d "/tmp/packmind-oss/${PROJ}" ] && continue
              # Listed whether or not the file exists yet: a missing entry is what tells
              # the skill to bootstrap that package's CLAUDE.md.
              echo "${PROJ}/CLAUDE.md" >> tmp/claude-md-worklist.txt
            done

            if [ ! -s tmp/claude-md-worklist.txt ]; then
              echo "::error::No proprietary-only project found - the OSS diff looks broken."
              exit 1
            fi

            echo 'SCOPE_NOTE=Scope: proprietary-only packages (projects absent from PackmindHub/packmind).' >> "$GITHUB_ENV"
          else
            find . -name CLAUDE.md -not -path './node_modules/*' \
              | sed 's|^\./||' | sort > tmp/claude-md-worklist.txt

            if [ ! -s tmp/claude-md-worklist.txt ]; then
              echo "::error::No CLAUDE.md found in the checkout. Aborting."
              exit 1
            fi

            echo 'SCOPE_NOTE=Scope: every CLAUDE.md in the repository.' >> "$GITHUB_ENV"
          fi

          echo "=== worklist ($(wc -l < tmp/claude-md-worklist.txt) entries) ==="
          cat tmp/claude-md-worklist.txt

      - name: Dump the Nx target inventory
        # Ground truth for the audit, alongside the worklist above. Nx *infers* targets that no
        # project.json lists, so neither the file nor the agent can tell a real command from a
        # plausible one: `frontend`'s build comes from @nx/react/router-plugin, and `migrations`
        # has no build target at all (only `bundle`). A CLAUDE.md that documents `nx build
        # migrations` sends every reader to a command that fails, which is what this prevents.
        # The skill reads tmp/nx-targets.txt and may not write a command absent from it.
        run: |
          set -euo pipefail
          mkdir -p tmp

          ./node_modules/.bin/nx graph --file=tmp/nx-graph.json > /dev/null

          node -e '
            const graph = require("./tmp/nx-graph.json");
            const nodes = graph.graph?.nodes ?? graph.nodes ?? {};
            const lines = Object.keys(nodes)
              .sort()
              .map(
                (project) =>
                  project +
                  ": " +
                  Object.keys(nodes[project].data.targets ?? {})
                    .sort()
                    .join(" "),
              );
            if (lines.length === 0) {
              console.error("::error::Nx project graph is empty - the target inventory would be a lie.");
              process.exit(1);
            }
            require("node:fs").writeFileSync("tmp/nx-targets.txt", lines.join("\n") + "\n");
          '

          rm tmp/nx-graph.json

          echo "=== nx targets ($(wc -l < tmp/nx-targets.txt) projects) ==="
          cat tmp/nx-targets.txt

      - name: Improve CLAUDE.md files with Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # The whole procedure lives in .claude/skills/improve-claude-md/SKILL.md:
        # which files to visit, what to fix, how to deduplicate against repository skills,
        # and which regions never to touch. Change the rules there, not here. The skill's
        # frontmatter also pins the model and the tool grant, so no --model / --allowedTools
        # flags belong on this call.
        run: claude -p "/improve-claude-md" --permission-mode acceptEdits

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PACKMIND_BOT_PAT }}
          branch: chore/weekly-claude-md-improvements
          delete-branch: true
          commit-message: 'chore: weekly CLAUDE.md improvements via claude-md-improver'
          title: 'chore: weekly CLAUDE.md improvements'
          body: |
            Automated weekly run of the `improve-claude-md` skill, which delegates the audit
            to Anthropic's `claude-md-improver`.

            ${{ env.SCOPE_NOTE }}

            - Applied only high/medium priority fixes with clear impact.
            - Missing `CLAUDE.md` files inside the run's scope were created from scratch.
            - Removed instructions that duplicate a repository skill (`.claude/skills/*/SKILL.md`), so
              deletions are expected in this diff - please check none of them went too far.
            - Packmind standards sections were left untouched.

            To change what this run does, edit `.claude/skills/improve-claude-md/SKILL.md`.

            Please review before merging.
          labels: automated
