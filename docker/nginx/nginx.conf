server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Must not be lower than the body-parser limit in apps/api/src/main.ts:
    # nginx answers 413 and closes as soon as it reads Content-Length, without
    # reading the body, so a browser still uploading sees the connection reset
    # rather than the 413 — surfacing as an opaque network error. Skill uploads
    # send every file inline as JSON, base64 for binaries.
    client_max_body_size 15m;

    location / {
        proxy_pass         http://frontend:4200;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
